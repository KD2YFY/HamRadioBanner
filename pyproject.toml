[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hamradiobanner"
version = "1.1.0"
description = "Always-on-top desktop banner with callsign, UTC/local time and weather"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyQt6>=6.4", "requests>=2.28"]

[project.gui-scripts]
hamradiobanner = "banner:main"

[tool.setuptools]
py-modules = ["banner"]
