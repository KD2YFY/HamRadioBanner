# Example settings. You don't need to edit this: the banner asks for your callsign
# on first run and saves config.ini for you. Right-click the banner > Settings to change.
[SETTINGS]
# Your amateur radio callsign
callsign = N0CALL

# Local timezone, e.g. America/New_York, Europe/London. Blank = use your computer's timezone.
# List: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone =

# Weather location. Blank = detect from your internet connection.
# Or a place ("Albany, NY", "London, United Kingdom") or coordinates ("42.65, -73.75").
location =

# Temperature units: F or C
units = F

# How often to refresh the weather, in minutes
weather_refresh = 30

# Show on: one = a single banner, all = a separate banner on every monitor
screens = one

# yes = install new versions automatically; no = show "Update available" and wait for a click
auto_update = no

# yes = stay on top of other windows (no taskbar button); no = normal window with a taskbar button
on_top = yes

# yes = scrolling solar & band-conditions ticker under the clock
solar = no
# Ticker speed: slow, normal or fast
ticker_speed = normal
