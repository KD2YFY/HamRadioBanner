# Example settings. You don't need to edit this: the banner asks for your callsign
# on first run and saves config.ini for you. Right-click the banner > Settings to change.
[SETTINGS]
# Your amateur radio callsign
callsign = N0CALL

# Local timezone, e.g. America/New_York, Europe/London. Blank = use your computer's timezone.
# List: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone =

# Weather location. Blank = detect from your internet connection.
# Or a place ("Albany, NY", "London, United Kingdom") or coordinates ("42.65, -73.75").
location =

# Temperature units: F or C
units = F

# How often to refresh the weather, in minutes
weather_refresh = 30

# Show on: one = a single banner, all = a separate banner on every monitor
screens = one

# yes = install new versions automatically; no = show "Update available" and wait for a click
auto_update = no

# yes = stay on top of other windows (no taskbar button); no = normal window with a taskbar button
on_top = yes

# yes = scrolling solar & band-conditions ticker under the clock
solar = no
# Ticker speed: slow, normal or fast
ticker_speed = normal

# yes = full-width bar docked at the top of the screen; other windows stay below it
dock = no

# Today's forecast high/low on the banner: yes or no
show_hilo = yes
# Highest/lowest temperature over the 24 hours ending at day_end (HH:MM, 24-hour clock)
show_24h = no
day_end = 06:30

# Weather on the banner: yes or no (no = hidden and not downloaded)
show_weather = yes

# Font sizes in points (6-72)
font_callsign = 14
font_clock = 18
font_weather = 14
font_ticker = 11
font_clock_label = 8
font_weather_label = 8
font_date = 10
font_conditions = 11

# Current conditions (sunny, cloudy, rain, snow, windy...): yes or no
show_conditions = no
# yes = the station (NWS or your own) also gives the current temperature
station_current = yes

# Where the 24-hour high/low comes from: station (NWS, US), model (Open-Meteo),
# or your own station: wu (Weather Underground), ambient (Ambient Weather), ecowitt
wx24_source = station
# NWS station ID (blank = nearest), Weather Underground station ID, or your station's MAC address
station =
# Your own station's keys (Weather Underground uses only api_key)
api_key =
app_key =
